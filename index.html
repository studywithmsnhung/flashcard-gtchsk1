<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HSK Buddy - Lesson Game</title>
  <style>
    /* ===== RESET & BASE ===== */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    button:disabled { cursor: not-allowed; }

    :root {
      color-scheme: light;
      --mint: #A8E6CF;
      --skysoft: #A7D8FF;
      --peach: #FFD3B6;
      --banana: #FFF2A6;
      --berry: #FFAAA5;
      --ink: #253044;
      --slate-100: #f1f5f9;
      --slate-200: #e2e8f0;
      --slate-300: #cbd5e1;
      --slate-400: #94a3b8;
      --slate-500: #64748b;
      --slate-600: #475569;
      --emerald-300: #6ee7b7;
      --emerald-400: #34d399;
      --emerald-500: #10b981;
      --emerald-600: #059669;
      --emerald-bg: #eef9f4;
      --rose-200: #fecdd3;
      --rose-300: #fda4af;
      --rose-500: #f43f5e;
      --rose-600: #e11d48;
      --rose-50: #fff1f2;
      --amber-700: #b45309;
      --orange-400: #fb923c;
      --orange-500: #f97316;
      --sky-500: #0ea5e9;
      --shadow-soft: 0 18px 40px rgba(64, 84, 116, 0.14);
      --shadow-button: 0 7px 0 rgba(51, 65, 85, 0.16);
      --shadow-button-active: 0 2px 0 rgba(51, 65, 85, 0.16);
    }

    body {
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(168, 230, 207, .34), rgba(167, 216, 255, .28)),
        #fbfcff;
    }

    /* ===== LAYOUT ===== */
    .main {
      max-width: 28rem;
      min-height: 100vh;
      margin: 0 auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
    }
    @media (min-width: 640px) {
      .main { padding: 24px 16px; }
    }

    /* ===== HEADER ===== */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .back-btn {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      background: #fff;
      box-shadow: var(--shadow-soft);
    }

    .xp-wrap { flex: 1; min-width: 0; }
    .xp-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.025em;
      color: var(--slate-500);
    }
    .xp-track {
      margin-top: 8px;
      height: 16px;
      border-radius: 9999px;
      background: #fff;
      overflow: hidden;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.06);
    }
    .xp-bar {
      height: 100%;
      width: 0%;
      border-radius: 9999px;
      background: linear-gradient(to right, var(--mint), var(--banana), var(--peach));
      transition: width 0.5s ease;
    }

    .streak {
      display: flex;
      align-items: center;
      gap: 6px;
      height: 44px;
      padding: 0 12px;
      border-radius: 16px;
      background: #fff;
      color: var(--orange-500);
      font-weight: 900;
      box-shadow: var(--shadow-soft);
    }

    /* ===== LESSON CARD (TOP) ===== */
    .lesson-card {
      margin-top: 20px;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 4px solid #fff;
      border-radius: 32px;
      background: linear-gradient(135deg, #ffffff, #f4fbff);
      box-shadow: var(--shadow-soft);
    }
    .lesson-brand {
      font-size: 14px;
      font-weight: 800;
      color: var(--slate-500);
      margin: 0;
    }
    .lesson-prompt {
      margin: 4px 0 0;
      font-size: 24px;
      font-weight: 900;
      line-height: 1.2;
    }
    .mascot-wrap {
      padding: 12px;
      border-radius: 26px;
      background: var(--banana);
      box-shadow: var(--shadow-button);
      animation: floaty 3s ease-in-out infinite;
    }
    .mascot {
      width: 56px;
      height: 56px;
      display: grid;
      place-items: center;
      border-radius: 20px;
      background: #fff;
      font-size: 30px;
      font-weight: 900;
    }

    /* ===== GAME PANEL ===== */
    .panel {
      margin-top: 20px;
      padding: 16px;
      flex: 1;
      border: 4px solid #fff;
      border-radius: 32px;
      background: rgba(255, 255, 255, 0.88);
      box-shadow: var(--shadow-soft);
    }
    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .combo {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 16px;
      background: var(--emerald-bg);
      color: var(--emerald-600);
      font-size: 14px;
      font-weight: 900;
    }
    .lesson-select {
      min-width: 0;
      padding: 8px 12px;
      border: none;
      border-radius: 16px;
      background: #fff7d4;
      color: var(--amber-700);
      font-size: 14px;
      font-weight: 900;
      outline: none;
    }
    .progress {
      padding: 8px 12px;
      border-radius: 16px;
      background: #fff7d4;
      color: var(--amber-700);
      font-size: 14px;
      font-weight: 900;
    }

    /* ===== VOCAB CARD ===== */
    .vocab-card {
      margin-top: 20px;
      padding: 20px;
      text-align: center;
      border-radius: 32px;
      background: linear-gradient(135deg, rgba(167, 216, 255, 0.6), rgba(168, 230, 207, 0.55));
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.06);
    }
    .card-label {
      margin: 0;
      font-size: 14px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.025em;
      color: var(--slate-500);
    }
    .term {
      margin-top: 12px;
      font-size: 72px;
      font-weight: 900;
      line-height: 1;
    }
    .reading {
      margin-top: 12px;
      display: inline-flex;
      padding: 8px 16px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.8);
      color: var(--slate-600);
      font-size: 18px;
      font-weight: 800;
    }
    .reading.hidden { display: none; }

    /* ===== ANSWERS ===== */
    .answers {
      margin-top: 20px;
      display: grid;
      gap: 12px;
    }
    .answer-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 64px;
      padding: 12px 16px;
      border: 4px solid var(--slate-100);
      border-radius: 24px;
      background: #fff;
      text-align: left;
      font-size: 18px;
      font-weight: 900;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      transition: transform .18s ease, border-color .18s ease, background .18s ease;
    }
    .answer-card:hover:not(:disabled) { transform: translateY(-2px); }
    .answer-card .marker {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2.5px solid var(--slate-300);
      flex-shrink: 0;
      position: relative;
      transition: all .18s ease;
    }
    /* Correct state */
    .answer-card.correct {
      border-color: var(--emerald-300);
      background: var(--emerald-bg);
    }
    .answer-card.correct .marker {
      border-color: var(--emerald-500);
      background: var(--emerald-500);
    }
    .answer-card.correct .marker::after {
      content: '';
      position: absolute;
      left: 4px;
      top: 1px;
      width: 5px;
      height: 9px;
      border: solid #fff;
      border-width: 0 2.5px 2.5px 0;
      transform: rotate(45deg);
    }
    /* Wrong state */
    .answer-card.wrong {
      border-color: var(--rose-300);
      background: var(--rose-50);
    }
    .answer-card.wrong .marker {
      border-color: var(--rose-500);
      background: var(--rose-500);
    }
    .answer-card.wrong .marker::before,
    .answer-card.wrong .marker::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 50%;
      width: 10px;
      height: 2.5px;
      background: #fff;
      border-radius: 2px;
    }
    .answer-card.wrong .marker::before { transform: translate(-50%, -50%) rotate(45deg); }
    .answer-card.wrong .marker::after  { transform: translate(-50%, -50%) rotate(-45deg); }

    /* ===== FEEDBACK BOX ===== */
    .feedback {
      margin-top: 16px;
      padding: 14px 16px;
      border: 4px solid transparent;
      border-radius: 24px;
      font-size: 16px;
      font-weight: 900;
      display: none;
    }
    .feedback.show { display: block; animation: pop 0.34s cubic-bezier(.2,1.4,.4,1); }
    .feedback.correct {
      border-color: var(--emerald-300);
      background: var(--emerald-bg);
      color: var(--emerald-600);
    }
    .feedback.wrong {
      border-color: var(--rose-300);
      background: var(--rose-50);
      color: var(--rose-600);
    }
    .feedback-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .feedback-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      flex-shrink: 0;
      position: relative;
      margin-top: 1px;
    }
    .feedback.correct .feedback-icon { background: var(--emerald-500); }
    .feedback.wrong   .feedback-icon { background: var(--rose-500); }
    /* Check mark for correct */
    .feedback.correct .feedback-icon::after {
      content: '';
      position: absolute;
      left: 9px;
      top: 5px;
      width: 7px;
      height: 13px;
      border: solid #fff;
      border-width: 0 3px 3px 0;
      transform: rotate(45deg);
    }
    /* X mark for wrong */
    .feedback.wrong .feedback-icon::before,
    .feedback.wrong .feedback-icon::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 50%;
      width: 14px;
      height: 3px;
      background: #fff;
      border-radius: 2px;
    }
    .feedback.wrong .feedback-icon::before { transform: translate(-50%, -50%) rotate(45deg); }
    .feedback.wrong .feedback-icon::after  { transform: translate(-50%, -50%) rotate(-45deg); }
    .feedback-title { font-size: 18px; margin: 0; }
    .feedback-detail { margin: 4px 0 0; font-size: 14px; font-weight: 800; color: var(--slate-600); }

    /* ===== CONTINUE BUTTON ===== */
    .continue-btn {
      margin-top: 20px;
      width: 100%;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 24px;
      background: var(--emerald-400);
      color: #fff;
      font-size: 18px;
      font-weight: 900;
      box-shadow: var(--shadow-button);
      transition: transform .16s ease, box-shadow .16s ease;
    }
    .continue-btn:disabled {
      background: var(--slate-200);
      color: var(--slate-400);
      box-shadow: none;
    }
    .continue-btn:not(:disabled):active {
      transform: translateY(5px) scale(.985);
      box-shadow: var(--shadow-button-active);
    }
    .continue-btn .arrow {
      display: inline-block;
      width: 18px;
      height: 18px;
      position: relative;
    }
    .continue-btn .arrow::before {
      content: '';
      position: absolute;
      left: 2px;
      top: 50%;
      width: 12px;
      height: 2.5px;
      background: currentColor;
      border-radius: 2px;
      transform: translateY(-50%);
    }
    .continue-btn .arrow::after {
      content: '';
      position: absolute;
      right: 1px;
      top: 50%;
      width: 8px;
      height: 8px;
      border-top: 2.5px solid currentColor;
      border-right: 2.5px solid currentColor;
      transform: translateY(-50%) rotate(45deg);
    }

    /* ===== BOTTOM NAV ===== */
    .nav {
      margin-top: 16px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      padding: 8px;
      border-radius: 28px;
      background: #fff;
      box-shadow: var(--shadow-soft);
    }
    .nav-btn {
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      color: var(--slate-400);
      font-size: 20px;
    }
    .nav-btn.active {
      background: var(--emerald-bg);
      color: var(--emerald-500);
    }

    /* ===== REWARD POPUP ===== */
    .reward-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      padding: 20px;
      align-items: center;
      justify-content: center;
      background: rgba(37, 48, 68, .36);
      backdrop-filter: blur(10px);
      display: none;
    }
    .reward-backdrop.show { display: flex; }
    .reward-card {
      position: relative;
      width: 100%;
      max-width: 24rem;
      padding: 24px;
      text-align: center;
      border: 4px solid #fff;
      border-radius: 32px;
      background: #fff;
      box-shadow: var(--shadow-soft);
      animation: pop 0.34s cubic-bezier(.2,1.4,.4,1);
    }
    .trophy {
      width: 96px;
      height: 96px;
      margin: 0 auto;
      display: grid;
      place-items: center;
      border-radius: 32px;
      background: var(--banana);
      font-size: 48px;
      box-shadow: var(--shadow-button);
    }
    .reward-title {
      margin: 20px 0 0;
      font-size: 28px;
      font-weight: 900;
    }
    .reward-message {
      margin: 8px 0 0;
      font-size: 16px;
      font-weight: 700;
      color: var(--slate-500);
    }
    .reward-stats {
      margin-top: 20px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .stat {
      padding: 16px 10px;
      border-radius: 24px;
    }
    .stat-label {
      font-size: 13px;
      font-weight: 900;
      color: var(--slate-500);
      margin: 0;
    }
    .stat-value {
      margin: 4px 0 0;
      font-size: 22px;
      font-weight: 900;
    }
    .stat.score  { background: #eef5ff; }
    .stat.score .stat-value  { color: var(--sky-500); }
    .stat.xp     { background: var(--emerald-bg); }
    .stat.xp .stat-value     { color: var(--emerald-500); }
    .stat.streak { background: #fff7d4; }
    .stat.streak .stat-value { color: var(--orange-500); }
    .restart-btn {
      margin-top: 24px;
      width: 100%;
      height: 56px;
      border-radius: 24px;
      background: var(--berry);
      color: #fff;
      font-size: 18px;
      font-weight: 900;
      box-shadow: var(--shadow-button);
      transition: transform .16s ease, box-shadow .16s ease;
    }
    .restart-btn:active {
      transform: translateY(5px) scale(.985);
      box-shadow: var(--shadow-button-active);
    }

    /* ===== CONFETTI ===== */
    .confetti {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .confetti span {
      position: absolute;
      width: 8px;
      height: 14px;
      border-radius: 4px;
      animation: fall 1.2s ease-in forwards;
    }

    /* ===== ANIMATIONS ===== */
    @keyframes fall {
      from { transform: translateY(-50px) rotate(0deg); opacity: 1; }
      to   { transform: translateY(210px) rotate(250deg); opacity: 0; }
    }
    @keyframes pop {
      0%   { transform: scale(.88); opacity: 0; }
      100% { transform: scale(1);   opacity: 1; }
    }
    @keyframes wiggle {
      0%, 100% { transform: rotate(0deg); }
      25%      { transform: rotate(-3deg); }
      75%      { transform: rotate(3deg); }
    }
    @keyframes floaty {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-8px); }
    }
    .animate-pop    { animation: pop 0.34s cubic-bezier(.2, 1.4, .4, 1); }
    .animate-wiggle { animation: wiggle 0.5s ease-in-out; }

    /* ===== SIMPLE ICONS (CSS-only) ===== */
    .icon { display: inline-block; }
    .icon-chevron-left {
      width: 12px; height: 12px;
      border-left: 3px solid currentColor;
      border-bottom: 3px solid currentColor;
      transform: rotate(45deg);
      border-radius: 1px;
    }
    .icon-flame {
      width: 18px; height: 18px;
      background: currentColor;
      clip-path: polygon(50% 0%, 75% 30%, 100% 60%, 85% 100%, 15% 100%, 0% 60%, 25% 30%);
    }
    .icon-spark {
      width: 14px; height: 14px;
      background: currentColor;
      clip-path: polygon(50% 0%, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0% 50%, 40% 40%);
    }
  </style>
</head>
<body>
  <main class="main">
    <header class="header">
      <button class="back-btn" aria-label="Quay lại">
        <span class="icon icon-chevron-left"></span>
      </button>
      <div class="xp-wrap">
        <div class="xp-row">
          <span id="lessonLabel">Bài 1</span>
          <span id="xpText">0 / 480 XP</span>
        </div>
        <div class="xp-track">
          <div id="xpBar" class="xp-bar"></div>
        </div>
      </div>
      <div class="streak" aria-label="Streak">
        <span class="icon icon-flame"></span>
        <span id="streakText">7</span>
      </div>
    </header>

    <section class="lesson-card">
      <div>
        <p id="lessonBrand" class="lesson-brand">HSK Buddy</p>
        <h1 id="lessonPrompt" class="lesson-prompt">Chọn nghĩa đúng</h1>
      </div>
      <div class="mascot-wrap" aria-hidden="true">
        <div id="lessonMascot" class="mascot">汉</div>
      </div>
    </section>

    <section class="panel">
      <div class="top-row">
        <div class="combo">
          <span class="icon icon-spark"></span>
          <span id="comboText">Combo x1</span>
        </div>
        <select id="lessonSelect" class="lesson-select" aria-label="Chọn bài học"></select>
        <div class="progress">
          <span id="progressText">1 / 20</span>
        </div>
      </div>

      <article id="vocabCard" class="vocab-card">
        <p id="cardLabel" class="card-label">Từ mới</p>
        <div id="term" class="term">你</div>
        <div id="reading" class="reading">nǐ</div>
      </article>

      <div id="answers" class="answers"></div>

      <div id="feedbackBox" class="feedback" aria-live="polite"></div>

      <button id="continueBtn" class="continue-btn" disabled>
        <span>Tiếp tục</span>
        <span class="arrow"></span>
      </button>
    </section>

    <nav class="nav" aria-label="Game navigation">
      <button class="nav-btn active" aria-label="Học">📖</button>
      <button class="nav-btn" aria-label="Luyện tập">🏋️</button>
      <button class="nav-btn" aria-label="Cúp">🏆</button>
      <button class="nav-btn" aria-label="Hồ sơ">👤</button>
    </nav>
  </main>

  <div id="rewardPopup" class="reward-backdrop">
    <div class="confetti" aria-hidden="true"></div>
    <section class="reward-card">
      <div class="trophy">🏆</div>
      <h2 id="rewardTitle" class="reward-title">Tuyệt vời!</h2>
      <p id="rewardMessage" class="reward-message">Bạn đã hoàn thành bài học và nhận thêm XP.</p>
      <div class="reward-stats">
        <div class="stat score">
          <p class="stat-label">Điểm</p>
          <p id="finalScore" class="stat-value">0/20</p>
        </div>
        <div class="stat xp">
          <p class="stat-label">XP</p>
          <p id="rewardXp" class="stat-value">+80</p>
        </div>
        <div class="stat streak">
          <p class="stat-label">Streak</p>
          <p id="rewardStreak" class="stat-value">+1</p>
        </div>
      </div>
      <button id="restartBtn" class="restart-btn">Chơi lại</button>
    </section>
  </div>

  <script>
    /* ===== LESSON DATA & LOGIC (giữ nguyên 100% từ bản gốc) ===== */
    const HSK_LESSON_MANIFEST = [
      { id: 'lesson-1', label: 'Bài 1' },
      { id: 'lesson-2', label: 'Bài 2' },
      { id: 'lesson-3', label: 'Bài 3' },
      { id: 'lesson-4', label: 'Bài 4' },
      { id: 'lesson-5', label: 'Bài 5' },
      { id: 'lesson-6', label: 'Bài 6' },
      { id: 'lesson-7', label: 'Bài 7' },
      { id: 'lesson-8', label: 'Bài 8' },
      { id: 'lesson-9', label: 'Bài 9' },
      { id: 'lesson-10', label: 'Bài 10' },
      { id: 'lesson-11', label: 'Bài 11' },
      { id: 'lesson-12', label: 'Bài 12' },
      { id: 'lesson-13', label: 'Bài 13' },
      { id: 'lesson-14', label: 'Bài 14' },
      { id: 'lesson-15', label: 'Bài 15' }
    ];

    const HSK_LESSONS = {
      'lesson-1': {
        id: 'lesson-1',
        label: 'Bài 1',
        title: 'HSK1 - Bài 1',
        brand: 'HSK Buddy',
        prompt: 'Chọn nghĩa đúng',
        mascot: '汉',
        cardLabel: 'Từ mới',
        questionCount: 20,
        initialProgress: { xp: 0, maxXp: 480, streak: 7 },
        rewards: {
          correctXp: 20,
          completionXp: 80,
          streakBonus: 1,
          title: 'Tuyệt vời!',
          message: 'Bạn đã hoàn thành 20 câu hỏi của Bài 1 và nhận thêm XP.'
        },
        vocabulary: [

      lessonSelect: document.getElementById('lessonSelect'),
      cardLabel: document.getElementById('cardLabel'),
      term: document.getElementById('term'),
      reading: document.getElementById('reading'),
      answers: document.getElementById('answers'),
      feedbackBox: document.getElementById('feedbackBox'),
      continueBtn: document.getElementById('continueBtn'),
      xpBar: document.getElementById('xpBar'),
      xpText: document.getElementById('xpText'),
      comboText: document.getElementById('comboText'),
      progressText: document.getElementById('progressText'),
      streakText: document.getElementById('streakText'),
      rewardPopup: document.getElementById('rewardPopup'),
      restartBtn: document.getElementById('restartBtn'),
      vocabCard: document.getElementById('vocabCard'),
      confetti: document.querySelector('.confetti'),
      rewardTitle: document.getElementById('rewardTitle'),
      rewardMessage: document.getElementById('rewardMessage'),
      finalScore: document.getElementById('finalScore'),
      rewardXp: document.getElementById('rewardXp'),
      rewardStreak: document.getElementById('rewardStreak')
    };

    const state = {
      lesson: null,
      index: 0,
      selected: null,
      currentCorrect: false,
      combo: 1,
      correctCount: 0,
      wrongCount: 0,
      xp: DEFAULT_PROGRESS.xp,
      maxXp: DEFAULT_PROGRESS.maxXp,
      streak: DEFAULT_PROGRESS.streak
    };

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function buildChoices(vocabulary, correctMeaning, seed) {
      const distractors = vocabulary
        .map((item) => item.meaning)
        .filter((meaning, index, meanings) => meaning !== correctMeaning && meanings.indexOf(meaning) === index);
      const split = seed % Math.max(1, distractors.length);
      const rotated = distractors.slice(split).concat(distractors.slice(0, split));
      const choices = [correctMeaning, ...rotated.slice(0, 3)];

      while (choices.length < 4) {
        choices.push(`Đáp án ${choices.length + 1}`);
      }

      const correctChoice = choices.shift();
      choices.splice(seed % 4, 0, correctChoice);
      return choices;
    }

    function normalizeLesson(lesson) {
      const cards = Array.from({ length: lesson.questionCount || 20 }, (_, index) => {
        const item = lesson.vocabulary[index % lesson.vocabulary.length];
        return {
          term: item.term,
          reading: item.reading,
          correct: item.meaning,
          choices: buildChoices(lesson.vocabulary, item.meaning, index)
        };
      });

      return { ...lesson, cards };
    }

    function updateXpDisplay() {
      elements.xpText.textContent = `${state.xp} / ${state.maxXp} XP`;
      elements.xpBar.style.width = `${Math.min(100, (state.xp / state.maxXp) * 100)}%`;
    }

    function setProgress(progress) {
      state.xp = progress?.xp ?? DEFAULT_PROGRESS.xp;
      state.maxXp = progress?.maxXp ?? DEFAULT_PROGRESS.maxXp;
      state.streak = progress?.streak ?? DEFAULT_PROGRESS.streak;
      elements.streakText.textContent = state.streak;
      updateXpDisplay();
    }

    function setupLessonSelect(activeId) {
      elements.lessonSelect.innerHTML = '';

      HSK_LESSON_MANIFEST.forEach((lesson) => {
        const option = document.createElement('option');
        option.value = lesson.id;
        option.textContent = lesson.label;
        option.selected = lesson.id === activeId;
        elements.lessonSelect.appendChild(option);
      });
    }

    function validateLesson(lesson) {
      if (!lesson || !Array.isArray(lesson.cards) || lesson.cards.length === 0) {
        throw new Error('Lesson data must include a non-empty cards array.');
      }

      lesson.cards.forEach((card, cardIndex) => {
        const hasChoices = Array.isArray(card.choices) && card.choices.length >= 2;
        if (!card.term || !hasChoices || !card.correct) {
          throw new Error(`Card ${cardIndex + 1} is missing term, choices, or correct.`);
        }
        if (!card.choices.includes(card.correct)) {
          throw new Error(`Card ${cardIndex + 1} choices must include the correct answer.`);
        }
      });
    }

    function applyLessonCopy() {
      const lesson = state.lesson;
      elements.lessonLabel.textContent = lesson.label || lesson.title || 'Bài học';
      elements.lessonBrand.textContent = lesson.brand || 'HSK Buddy';
      elements.lessonPrompt.textContent = lesson.prompt || 'Chọn nghĩa đúng';
      elements.lessonMascot.textContent = lesson.mascot || '汉';
      elements.cardLabel.textContent = lesson.cardLabel || 'Từ vựng';
    }

    /* ===== FEEDBACK (CSS thuần — đúng/sai có màu, icon SVG) ===== */
    function hideFeedback() {
      elements.feedbackBox.className = 'feedback';
      elements.feedbackBox.innerHTML = '';
    }

    function showFeedback(isCorrect, selectedAnswer, correctAnswer) {
      elements.feedbackBox.className = `feedback show ${isCorrect ? 'correct' : 'wrong'}`;
      elements.feedbackBox.innerHTML = `
        <div class="feedback-row">
          <span class="feedback-icon" aria-hidden="true"></span>
          <div>
            <p class="feedback-title">${isCorrect ? 'Chính xác!' : 'Chưa đúng'}</p>
            <p class="feedback-detail">Bạn chọn: ${escapeHtml(selectedAnswer)}</p>
            <p class="feedback-detail">Đáp án đúng: ${escapeHtml(correctAnswer)}</p>
          </div>
        </div>
      `;
    }

    function resetLessonState() {
      state.index = 0;
      state.selected = null;
      state.currentCorrect = false;
      state.combo = 1;
      state.correctCount = 0;
      state.wrongCount = 0;
      elements.comboText.textContent = 'Combo x1';
      hideFeedback();
      elements.rewardPopup.classList.remove('show');
    }

    function renderCurrentCard() {
      state.selected = null;
      state.currentCorrect = false;
      elements.continueBtn.disabled = true;
      hideFeedback();

      const card = state.lesson.cards[state.index];
      elements.term.textContent = card.term;
      elements.reading.textContent = card.reading || '';
      elements.reading.classList.toggle('hidden', !card.reading);
      elements.progressText.textContent = `${state.index + 1} / ${state.lesson.cards.length}`;
      elements.answers.innerHTML = '';

      card.choices.forEach((choice) => {
        const button = document.createElement('button');
        button.className = 'answer-card';
        button.innerHTML = `<span class="choice-text">${escapeHtml(choice)}</span><span class="marker"></span>`;
        button.addEventListener('click', () => chooseAnswer(button, choice));
        elements.answers.appendChild(button);
      });
    }

    function chooseAnswer(button, choice) {
      if (state.selected) return;

      state.selected = choice;
      elements.continueBtn.disabled = false;

      const currentCard = state.lesson.cards[state.index];
      const isCorrect = choice === currentCard.correct;
      state.currentCorrect = isCorrect;

      // Đánh dấu nút được chọn: đúng (xanh) hoặc sai (đỏ)
      button.classList.add(isCorrect ? 'correct' : 'wrong');

      if (isCorrect) {
        button.classList.add('animate-pop');
      } else {
        button.classList.add('animate-wiggle');
        state.combo = 1;

        // Khi sai → highlight đáp án đúng (xanh) để học sinh thấy
        [...elements.answers.children].forEach((item) => {
          if (item.querySelector('.choice-text').textContent === currentCard.correct) {
            item.classList.add('correct');
          }
        });
      }

      // Khóa tất cả lựa chọn sau khi đã chọn
      [...elements.answers.children].forEach((item) => {
        item.disabled = true;
      });

      showFeedback(isCorrect, choice, currentCard.correct);
      elements.comboText.textContent = `Combo x${state.combo}`;
    }

    function addXp(amount) {
      state.xp = Math.min(state.maxXp, state.xp + amount);
      updateXpDisplay();
    }

    function buildConfetti() {
      const colors = ['#A8E6CF', '#A7D8FF', '#FFD3B6', '#FFF2A6', '#FFAAA5'];
      elements.confetti.innerHTML = '';

      for (let i = 0; i < 34; i += 1) {
        const piece = document.createElement('span');
        piece.style.left = `${Math.random() * 100}%`;
        piece.style.top = `${Math.random() * 18}%`;
        piece.style.background = colors[i % colors.length];
        piece.style.animationDelay = `${Math.random() * .45}s`;
        elements.confetti.appendChild(piece);
      }
    }

    function showReward() {
      const reward = state.lesson.rewards || {};
      const completionXp = reward.completionXp ?? 80;
      const streakBonus = reward.streakBonus ?? 1;

      state.streak += streakBonus;
      addXp(completionXp);
      elements.streakText.textContent = state.streak;
      elements.rewardTitle.textContent = reward.title || 'Tuyệt vời!';
      elements.rewardMessage.textContent = `Bạn đúng ${state.correctCount}/${state.lesson.cards.length} câu. ${reward.message || 'Bạn đã hoàn thành bài học và nhận thêm XP.'}`;
      elements.finalScore.textContent = `${state.correctCount}/${state.lesson.cards.length}`;
      elements.rewardXp.textContent = `+${completionXp}`;
      elements.rewardStreak.textContent = `+${streakBonus}`;

      buildConfetti();
      elements.rewardPopup.classList.add('show');
    }

    function continueLesson() {
      if (!state.selected) return;

      if (state.currentCorrect) {
        state.correctCount += 1;
        state.combo += 1;
        addXp(state.lesson.rewards?.correctXp ?? 20);
      } else {
        state.wrongCount += 1;
      }

      state.index += 1;
      elements.vocabCard.classList.add('animate-pop');
      setTimeout(() => elements.vocabCard.classList.remove('animate-pop'), 360);

      if (state.index >= state.lesson.cards.length) {
        showReward();
        return;
      }

      elements.comboText.textContent = `Combo x${state.combo}`;
      renderCurrentCard();
    }

    function startLesson(id, options = {}) {
      const lesson = normalizeLesson(HSK_LESSONS[id]);
      validateLesson(lesson);

      state.lesson = lesson;
      setupLessonSelect(lesson.id);
      applyLessonCopy();
      resetLessonState();

      if (options.resetProgress || lesson.resetProgressOnStart) {
        setProgress(lesson.initialProgress);
      }

      renderCurrentCard();
    }

    function getInitialLessonId() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('lesson') || HSK_LESSON_MANIFEST[0].id;
      return HSK_LESSONS[id] ? id : HSK_LESSON_MANIFEST[0].id;
    }

    elements.lessonSelect.addEventListener('change', () => {
      const nextLessonId = elements.lessonSelect.value;
      window.history.replaceState(null, '', `?lesson=${encodeURIComponent(nextLessonId)}`);
      startLesson(nextLessonId);
    });

    elements.continueBtn.addEventListener('click', continueLesson);

    elements.restartBtn.addEventListener('click', () => {
      resetLessonState();
      renderCurrentCard();
    });

    document.addEventListener('DOMContentLoaded', () => {
      setupLessonSelect(getInitialLessonId());
      startLesson(getInitialLessonId(), { resetProgress: true });
    });
  </script>
</body>
</html>
