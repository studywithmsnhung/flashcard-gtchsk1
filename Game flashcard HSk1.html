<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HSK Buddy - Lesson Game</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            mint: '#A8E6CF',
            skysoft: '#A7D8FF',
            peach: '#FFD3B6',
            banana: '#FFF2A6',
            berry: '#FFAAA5',
            ink: '#253044'
          },
          boxShadow: {
            soft: '0 18px 40px rgba(64, 84, 116, 0.14)',
            button: '0 7px 0 rgba(51, 65, 85, 0.16)'
          },
          animation: {
            pop: 'pop 0.34s cubic-bezier(.2,1.4,.4,1)',
            wiggle: 'wiggle 0.5s ease-in-out',
            floaty: 'floaty 3s ease-in-out infinite'
          },
          keyframes: {
            pop: {
              '0%': { transform: 'scale(.88)', opacity: 0 },
              '100%': { transform: 'scale(1)', opacity: 1 }
            },
            wiggle: {
              '0%, 100%': { transform: 'rotate(0deg)' },
              '25%': { transform: 'rotate(-3deg)' },
              '75%': { transform: 'rotate(3deg)' }
            },
            floaty: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-8px)' }
            }
          }
        }
      }
    };
  </script>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        linear-gradient(135deg, rgba(168, 230, 207, .34), rgba(167, 216, 255, .28)),
        #fbfcff;
    }

    .tap-button {
      transition: transform .16s ease, box-shadow .16s ease, filter .16s ease;
    }

    .tap-button:active {
      transform: translateY(5px) scale(.985);
      box-shadow: 0 2px 0 rgba(51, 65, 85, .16);
      filter: saturate(1.08);
    }

    .answer-card {
      transition: transform .18s ease, border-color .18s ease, background .18s ease;
    }

    .answer-card:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    .reward-backdrop {
      background: rgba(37, 48, 68, .36);
      backdrop-filter: blur(10px);
    }

    .confetti span {
      position: absolute;
      width: 8px;
      height: 14px;
      border-radius: 4px;
      animation: fall 1.2s ease-in forwards;
    }

    @keyframes fall {
      from { transform: translateY(-50px) rotate(0deg); opacity: 1; }
      to { transform: translateY(210px) rotate(250deg); opacity: 0; }
    }
  </style>
</head>
<body class="text-ink">
  <main class="mx-auto flex min-h-screen w-full max-w-md flex-col px-4 py-4 sm:py-6">
    <header class="flex items-center justify-between gap-3">
      <button class="tap-button grid h-11 w-11 place-items-center rounded-2xl bg-white shadow-soft" aria-label="Quay lại">
        <i data-lucide="chevron-left" class="h-5 w-5"></i>
      </button>
      <div class="min-w-0 flex-1">
        <div class="flex items-center justify-between text-xs font-black uppercase tracking-wide text-slate-500">
          <span id="lessonLabel">Bài 1</span>
          <span id="xpText">0 / 480 XP</span>
        </div>
        <div class="mt-2 h-4 overflow-hidden rounded-full bg-white shadow-inner">
          <div id="xpBar" class="h-full w-0 rounded-full bg-gradient-to-r from-mint via-banana to-peach transition-all duration-500"></div>
        </div>
      </div>
      <div class="flex h-11 items-center gap-1.5 rounded-2xl bg-white px-3 font-black text-orange-500 shadow-soft" aria-label="Streak">
        <i data-lucide="flame" class="h-5 w-5 fill-orange-400 text-orange-400"></i>
        <span id="streakText">7</span>
      </div>
    </header>

    <section class="mt-5 flex items-center justify-between rounded-[2rem] border-4 border-white bg-gradient-to-br from-white to-[#f4fbff] p-4 shadow-soft">
      <div class="min-w-0">
        <p id="lessonBrand" class="text-sm font-extrabold text-slate-500">HSK Buddy</p>
        <h1 id="lessonPrompt" class="mt-1 text-2xl font-black leading-tight">Chọn nghĩa đúng</h1>
      </div>
      <div class="animate-floaty rounded-[1.6rem] bg-banana p-3 shadow-button" aria-hidden="true">
        <div id="lessonMascot" class="grid h-14 w-14 place-items-center rounded-[1.25rem] bg-white text-3xl">汉</div>
      </div>
    </section>

    <section class="mt-5 flex-1 rounded-[2rem] border-4 border-white bg-white/88 p-4 shadow-soft">
      <div class="flex items-center justify-between gap-3">
        <div class="flex items-center gap-2 rounded-2xl bg-[#eef9f4] px-3 py-2 text-sm font-black text-emerald-600">
          <i data-lucide="sparkles" class="h-4 w-4"></i>
          <span id="comboText">Combo x1</span>
        </div>
        <select id="lessonSelect" class="min-w-0 rounded-2xl border-0 bg-[#fff7d4] px-3 py-2 text-sm font-black text-amber-700 outline-none" aria-label="Chọn bài học"></select>
        <div class="rounded-2xl bg-[#fff7d4] px-3 py-2 text-sm font-black text-amber-700">
          <span id="progressText">1 / 20</span>
        </div>
      </div>

      <article id="vocabCard" class="mt-5 rounded-[2rem] bg-gradient-to-br from-skysoft/60 to-mint/55 p-5 text-center shadow-inner">
        <p id="cardLabel" class="text-sm font-black uppercase tracking-wide text-slate-500">Từ mới</p>
        <div id="term" class="mt-3 text-7xl font-black leading-none">你</div>
        <div id="reading" class="mt-3 inline-flex rounded-full bg-white/80 px-4 py-2 text-lg font-extrabold text-slate-600">nǐ</div>
      </article>

      <div id="answers" class="mt-5 grid gap-3"></div>

      <div id="feedbackBox" class="mt-4 hidden rounded-3xl border-4 px-4 py-3 text-base font-black" aria-live="polite"></div>

      <button id="continueBtn" class="tap-button mt-5 flex h-14 w-full items-center justify-center gap-2 rounded-3xl bg-emerald-400 text-lg font-black text-white shadow-button disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400 disabled:shadow-none" disabled>
        <span>Tiếp tục</span>
        <i data-lucide="arrow-right" class="h-5 w-5"></i>
      </button>
    </section>

    <nav class="mt-4 grid grid-cols-4 gap-2 rounded-[1.75rem] bg-white p-2 shadow-soft" aria-label="Game navigation">
      <button class="tap-button grid h-12 place-items-center rounded-2xl bg-[#eef9f4] text-emerald-500" aria-label="Học">
        <i data-lucide="book-open" class="h-5 w-5"></i>
      </button>
      <button class="tap-button grid h-12 place-items-center rounded-2xl text-slate-400" aria-label="Luyện tập">
        <i data-lucide="dumbbell" class="h-5 w-5"></i>
      </button>
      <button class="tap-button grid h-12 place-items-center rounded-2xl text-slate-400" aria-label="Cúp">
        <i data-lucide="trophy" class="h-5 w-5"></i>
      </button>
      <button class="tap-button grid h-12 place-items-center rounded-2xl text-slate-400" aria-label="Hồ sơ">
        <i data-lucide="user-round" class="h-5 w-5"></i>
      </button>
    </nav>
  </main>

  <div id="rewardPopup" class="reward-backdrop fixed inset-0 z-50 hidden items-center justify-center p-5">
    <div class="confetti pointer-events-none absolute inset-0 overflow-hidden" aria-hidden="true"></div>
    <section class="relative w-full max-w-sm animate-pop rounded-[2rem] border-4 border-white bg-white p-6 text-center shadow-soft">
      <div class="mx-auto grid h-24 w-24 place-items-center rounded-[2rem] bg-banana text-5xl shadow-button">
        <i data-lucide="trophy" class="h-12 w-12 text-amber-500"></i>
      </div>
      <h2 id="rewardTitle" class="mt-5 text-3xl font-black">Tuyệt vời!</h2>
      <p id="rewardMessage" class="mt-2 text-base font-bold text-slate-500">Bạn đã hoàn thành bài học và nhận thêm XP.</p>
      <div class="mt-5 grid grid-cols-3 gap-3">
        <div class="rounded-3xl bg-[#eef5ff] p-4">
          <p class="text-sm font-black text-slate-500">Điểm</p>
          <p id="finalScore" class="text-2xl font-black text-sky-500">0/20</p>
        </div>
        <div class="rounded-3xl bg-[#eef9f4] p-4">
          <p class="text-sm font-black text-slate-500">XP</p>
          <p id="rewardXp" class="text-2xl font-black text-emerald-500">+80</p>
        </div>
        <div class="rounded-3xl bg-[#fff7d4] p-4">
          <p class="text-sm font-black text-slate-500">Streak</p>
          <p id="rewardStreak" class="text-2xl font-black text-orange-500">+1</p>
        </div>
      </div>
      <button id="restartBtn" class="tap-button mt-6 h-14 w-full rounded-3xl bg-berry text-lg font-black text-white shadow-button">
        Chơi lại
      </button>
    </section>
  </div>

    const state = {
      lesson: null,
      index: 0,
      selected: null,
      currentCorrect: false,
      combo: 1,

    function iconRefresh() {
      if (window.lucide) {
        window.lucide.createIcons();
      }
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function buildChoices(vocabulary, correctMeaning, seed) {
      const distractors = vocabulary
        .map((item) => item.meaning)
        .filter((meaning, index, meanings) => meaning !== correctMeaning && meanings.indexOf(meaning) === index);
      const split = seed % Math.max(1, distractors.length);
      const rotated = distractors.slice(split).concat(distractors.slice(0, split));
      const choices = [correctMeaning, ...rotated.slice(0, 3)];

      while (choices.length < 4) {
        choices.push(`Đáp án ${choices.length + 1}`);
      }

      const correctChoice = choices.shift();
      choices.splice(seed % 4, 0, correctChoice);
      return choices;
    }

    function normalizeLesson(lesson) {
      const cards = Array.from({ length: lesson.questionCount || 20 }, (_, index) => {
        const item = lesson.vocabulary[index % lesson.vocabulary.length];
        return {
          term: item.term,
          reading: item.reading,
          correct: item.meaning,
          choices: buildChoices(lesson.vocabulary, item.meaning, index)
        };
      });

      return { ...lesson, cards };
    }

    function updateXpDisplay() {
      elements.xpText.textContent = `${state.xp} / ${state.maxXp} XP`;
      elements.xpBar.style.width = `${Math.min(100, (state.xp / state.maxXp) * 100)}%`;
    }

    function setProgress(progress) {
      state.xp = progress?.xp ?? DEFAULT_PROGRESS.xp;
      state.maxXp = progress?.maxXp ?? DEFAULT_PROGRESS.maxXp;
      state.streak = progress?.streak ?? DEFAULT_PROGRESS.streak;
      elements.streakText.textContent = state.streak;
      updateXpDisplay();
    }

    function setupLessonSelect(activeId) {
      elements.lessonSelect.innerHTML = '';

      HSK_LESSON_MANIFEST.forEach((lesson) => {
        const option = document.createElement('option');
        option.value = lesson.id;
        option.textContent = lesson.label;
        option.selected = lesson.id === activeId;
        elements.lessonSelect.appendChild(option);
      });
    }

    function validateLesson(lesson) {
      if (!lesson || !Array.isArray(lesson.cards) || lesson.cards.length === 0) {
        throw new Error('Lesson data must include a non-empty cards array.');
      }

      lesson.cards.forEach((card, cardIndex) => {
        const hasChoices = Array.isArray(card.choices) && card.choices.length >= 2;
        if (!card.term || !hasChoices || !card.correct) {
          throw new Error(`Card ${cardIndex + 1} is missing term, choices, or correct.`);
        }
        if (!card.choices.includes(card.correct)) {
          throw new Error(`Card ${cardIndex + 1} choices must include the correct answer.`);
        }
      });
    }

    function applyLessonCopy() {
      const lesson = state.lesson;
      elements.lessonLabel.textContent = lesson.label || lesson.title || 'Bài học';
      elements.lessonBrand.textContent = lesson.brand || 'HSK Buddy';
      elements.lessonPrompt.textContent = lesson.prompt || 'Chọn nghĩa đúng';
      elements.lessonMascot.textContent = lesson.mascot || '汉';
      elements.cardLabel.textContent = lesson.cardLabel || 'Từ vựng';
    }

    function hideFeedback() {
      elements.feedbackBox.textContent = '';
      elements.feedbackBox.className = 'mt-4 hidden rounded-3xl border-4 px-4 py-3 text-base font-black';
    }

    function showFeedback(isCorrect, selectedAnswer, correctAnswer) {
      elements.feedbackBox.className = `mt-4 rounded-3xl border-4 px-4 py-3 text-base font-black ${
        isCorrect
          ? 'border-emerald-200 bg-[#eef9f4] text-emerald-600'
          : 'border-rose-200 bg-rose-50 text-rose-600'
      }`;
      elements.feedbackBox.innerHTML = `
        <div class="flex items-start gap-3">
          <i data-lucide="${isCorrect ? 'check-circle-2' : 'x-circle'}" class="mt-0.5 h-6 w-6 shrink-0"></i>
          <div class="min-w-0">
            <p class="text-lg">${isCorrect ? 'Correct!' : 'Incorrect'}</p>
            <p class="mt-1 text-sm font-extrabold text-slate-600">Bạn chọn: ${escapeHtml(selectedAnswer)}</p>
            <p class="text-sm font-extrabold text-slate-600">Đáp án đúng: ${escapeHtml(correctAnswer)}</p>
          </div>
        </div>
      `;
    }

    function resetLessonState() {
      state.index = 0;
      state.selected = null;
      state.currentCorrect = false;
      state.combo = 1;
      state.correctCount = 0;
      state.wrongCount = 0;
      elements.comboText.textContent = 'Combo x1';
      hideFeedback();
      elements.rewardPopup.classList.add('hidden');
      elements.rewardPopup.classList.remove('flex');
    }

    function renderCurrentCard() {
      state.selected = null;
      state.currentCorrect = false;
      elements.continueBtn.disabled = true;
      hideFeedback();

      const card = state.lesson.cards[state.index];
      elements.term.textContent = card.term;
      elements.reading.textContent = card.reading || '';
      elements.reading.classList.toggle('hidden', !card.reading);
      elements.progressText.textContent = `${state.index + 1} / ${state.lesson.cards.length}`;
      elements.answers.innerHTML = '';

      card.choices.forEach((choice) => {
        const button = document.createElement('button');
        button.className = 'answer-card flex min-h-16 items-center justify-between rounded-3xl border-4 border-slate-100 bg-white px-4 py-3 text-left text-lg font-black shadow-sm';
        button.innerHTML = `<span>${escapeHtml(choice)}</span><i data-lucide="circle" class="h-5 w-5 text-slate-300"></i>`;
        button.addEventListener('click', () => chooseAnswer(button, choice));
        elements.answers.appendChild(button);
      });

      iconRefresh();
    }

    function chooseAnswer(button, choice) {
      if (state.selected) return;

      state.selected = choice;
      elements.continueBtn.disabled = false;

      [...elements.answers.children].forEach((item) => {
        item.classList.remove('border-emerald-300', 'bg-[#eef9f4]', 'border-rose-300', 'bg-rose-50', 'animate-wiggle');
        item.classList.add('border-slate-100', 'bg-white');
        item.querySelector('i').setAttribute('data-lucide', 'circle');
        item.querySelector('i').className = 'h-5 w-5 text-slate-300';
      });

      const currentCard = state.lesson.cards[state.index];
      const isCorrect = choice === currentCard.correct;
      state.currentCorrect = isCorrect;
      button.classList.remove('border-slate-100', 'bg-white');
      button.classList.add(isCorrect ? 'border-emerald-300' : 'border-rose-300', isCorrect ? 'bg-[#eef9f4]' : 'bg-rose-50');
      button.querySelector('i').setAttribute('data-lucide', isCorrect ? 'check-circle-2' : 'x-circle');
      button.querySelector('i').className = `h-5 w-5 ${isCorrect ? 'text-emerald-500' : 'text-rose-500'}`;

      if (!isCorrect) {
        button.classList.add('animate-wiggle');
        state.combo = 1;

        [...elements.answers.children].forEach((item) => {
          if (item.querySelector('span').textContent === currentCard.correct) {
            item.classList.remove('border-slate-100', 'bg-white');
            item.classList.add('border-emerald-300', 'bg-[#eef9f4]');
            item.querySelector('i').setAttribute('data-lucide', 'check-circle-2');
            item.querySelector('i').className = 'h-5 w-5 text-emerald-500';
          }
        });
      }

      [...elements.answers.children].forEach((item) => {
        item.disabled = true;
        item.classList.add('cursor-default');
      });

      showFeedback(isCorrect, choice, currentCard.correct);
      elements.comboText.textContent = `Combo x${state.combo}`;
      iconRefresh();
    }

    function addXp(amount) {
      state.xp = Math.min(state.maxXp, state.xp + amount);
      updateXpDisplay();
    }

    function buildConfetti() {
      const colors = ['#A8E6CF', '#A7D8FF', '#FFD3B6', '#FFF2A6', '#FFAAA5'];
      elements.confetti.innerHTML = '';

      for (let i = 0; i < 34; i += 1) {
        const piece = document.createElement('span');
        piece.style.left = `${Math.random() * 100}%`;
        piece.style.top = `${Math.random() * 18}%`;
        piece.style.background = colors[i % colors.length];
        piece.style.animationDelay = `${Math.random() * .45}s`;
        elements.confetti.appendChild(piece);
      }
    }

    function showReward() {
      const reward = state.lesson.rewards || {};
      const completionXp = reward.completionXp ?? 80;
      const streakBonus = reward.streakBonus ?? 1;

      state.streak += streakBonus;
      addXp(completionXp);
      elements.streakText.textContent = state.streak;
      elements.rewardTitle.textContent = reward.title || 'Tuyệt vời!';
      elements.rewardMessage.textContent = `Bạn đúng ${state.correctCount}/${state.lesson.cards.length} câu. ${reward.message || 'Bạn đã hoàn thành bài học và nhận thêm XP.'}`;
      elements.finalScore.textContent = `${state.correctCount}/${state.lesson.cards.length}`;
      elements.rewardXp.textContent = `+${completionXp}`;
      elements.rewardStreak.textContent = `+${streakBonus}`;

      buildConfetti();
      elements.rewardPopup.classList.remove('hidden');
      elements.rewardPopup.classList.add('flex');
      iconRefresh();
    }

    function continueLesson() {
      if (!state.selected) return;

      if (state.currentCorrect) {
        state.correctCount += 1;
        state.combo += 1;
        addXp(state.lesson.rewards?.correctXp ?? 20);
      } else {
        state.wrongCount += 1;
      }

      state.index += 1;
      elements.vocabCard.classList.add('animate-pop');
      setTimeout(() => elements.vocabCard.classList.remove('animate-pop'), 360);

      if (state.index >= state.lesson.cards.length) {
        showReward();
        return;
      }

      elements.comboText.textContent = `Combo x${state.combo}`;
      renderCurrentCard();
    }

    function startLesson(id, options = {}) {
      const lesson = normalizeLesson(HSK_LESSONS[id]);
      validateLesson(lesson);

      state.lesson = lesson;
      setupLessonSelect(lesson.id);
      applyLessonCopy();
      resetLessonState();

      if (options.resetProgress || lesson.resetProgressOnStart) {
        setProgress(lesson.initialProgress);
      }

      renderCurrentCard();
      iconRefresh();
    }

    function getInitialLessonId() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('lesson') || HSK_LESSON_MANIFEST[0].id;
      return HSK_LESSONS[id] ? id : HSK_LESSON_MANIFEST[0].id;
    }

    elements.lessonSelect.addEventListener('change', () => {
      const nextLessonId = elements.lessonSelect.value;
      window.history.replaceState(null, '', `?lesson=${encodeURIComponent(nextLessonId)}`);
      startLesson(nextLessonId);
    });

    elements.continueBtn.addEventListener('click', continueLesson);

    elements.restartBtn.addEventListener('click', () => {
      resetLessonState();
      renderCurrentCard();
    });

    document.addEventListener('DOMContentLoaded', () => {
      setupLessonSelect(getInitialLessonId());
      startLesson(getInitialLessonId(), { resetProgress: true });
    });
  </script>
</body>
</html>
